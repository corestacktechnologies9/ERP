  <div class="ft"><div>${c.bank && v.type !== 'purchase' ? `<div class="muted">Bank details</div>${esc(c.bank).replace(/\n/g, '<br>')}<br>` : ''}${c.terms && v.type === 'sale' ? `<div class="muted" style="margin-top:6px">Terms</div>${esc(c.terms).replace(/\n/g, '<br>')}` : ''}</div>
    <div class="sig">For <b>${esc(c.name || '')}</b><br><br><br>Authorised signatory</div></div>
  <div class="note">This is a computer-generated document.</div></div>`;
}
function receiptInner(v) {
  const c = S.company || {}; const rc = v.type === 'receipt';
  const dr = (v.entries || []).find(e => num(e.dr)) || {}, cr = (v.entries || []).find(e => num(e.cr)) || {};
  const party = rc ? cr.l : dr.l, acct = rc ? dr.l : cr.l, amt = vAmount(v);
  return `<div class="inv">${invHeader(rc ? ['प्राप्ति रसीद', 'RECEIPT', ''] : ['भुगतान वाउचर', 'PAYMENT VOUCHER', ''])}
    <div class="rc"><div style="display:flex;justify-content:space-between"><span>No. <b>${esc(v.no)}</b></span><span>Date <b>${dmy(v.date)}</b></span></div>
    ${rc ? 'Received with thanks from' : 'Paid to'} <b>${esc(lname(party))}</b> the sum of <b>${esc(wordsEn(amt))}</b><br><span lang="hi">${esc(wordsHi(amt))}</span><br>
    ${rc ? 'by' : 'from'} ${esc(lname(acct))}${v.narration ? `, towards ${esc(v.narration)}` : ''}.
    <div style="display:flex;justify-content:space-between;align-items:flex-end;margin-top:22px"><span class="amt">₹ ${money(amt)}</span><span>For <b>${esc(c.name || '')}</b><br><br><br>Authorised signatory</span></div></div>
    <div class="note">This is a computer-generated document.</div></div>`;
}
const voucherInner = v => TYPES[v.type].trade ? invoiceInner(v) : receiptInner(v);
function voucherDoc(v) {
  return `<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>${esc(TYPES[v.type].label)} ${esc(v.no)}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anek+Devanagari:wght@400;600;700&family=Anek+Latin:wght@400;600;700&display=swap">
  <style>body{margin:10mm;background:#fff}${PRINT_CSS}@media print{body{margin:0}}</style></head><body>${voucherInner(v)}<script>setTimeout(function(){try{window.print()}catch(e){}},600)<\/script></body></html>`;
}
function printVoucher(v) {
  const pa = $('#print-area'); pa.innerHTML = `<style>${PRINT_CSS}</style>${voucherInner(v)}`;
  const done = () => { pa.innerHTML = ''; window.removeEventListener('afterprint', done); };
  window.addEventListener('afterprint', done);
  setTimeout(() => {
    let ok = true; try { window.print(); } catch (e) { ok = false; }
    if (!ok) toast('Printing is blocked in this view. Use Download and print the file instead.', 'err');
  }, 60);
}

/* =================== Google Sheet data layer (Apps Script web app) =================== */
const ROLE_LABEL = { owner: 'Owner', admin: 'Admin', staff: 'Staff', viewer: 'Viewer', pending: 'No access' };
const MASTER_TABLES = ['items', 'parties', 'ledgers'];
const CFG = window.BAHI_CONFIG || {};
const TOKEN_KEY = 'bahi_token';
S.sv = {}; S.vv = -1; S.token = null;

function dbErrMsg(e) {
  const m = String((e && (e.message || e.error)) || '');
  const k = m.match(/^(NOT_ALLOWED|BAD_INPUT|CONFLICT|LOCKED|UNBALANCED|IN_USE|BUSY|AUTH|LOGIN):\s*([\s\S]*)$/);
  if (k) return k[2].charAt(0).toUpperCase() + k[2].slice(1).replace(/\.?$/, '.');
  if (/Failed to fetch|NetworkError|Load failed|network|fetch/i.test(m)) return 'The Google Sheet can\u2019t be reached. Check the internet connection and try again.';
  return m.replace(/^ERROR:\s*/, '') || 'Something went wrong while saving.';
}
async function call(action, args) {
  let res;
  try {
    res = await fetch(CFG.scriptUrl, { method: 'POST', redirect: 'follow', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ action, token: S.token, args: args || {} }) });
  } catch (e) { throw { message: 'Failed to fetch' }; }
  if (!res.ok) throw { message: `Failed to fetch (${res.status})` };
  let j; try { j = await res.json(); } catch (e) { throw { message: 'The Apps Script web app didn\u2019t answer properly. Check that it is deployed with access set to Anyone.' }; }
  if (!j.ok) {
    if (j.code === 'AUTH' && S.loaded.all) { signedOut(j.error); }
    throw { message: j.error, code: j.code };
  }
  return j.data;
}
const rpc = (fn, args) => call(fn, args);
function signedOut(message) {
  try { localStorage.removeItem(TOKEN_KEY); } catch (e) { }
  S.token = null; S.loaded.all = false; started = false; stopPolling(); closeSheetNow(); closeDialog();
  showLogin('in', String(message || '').replace(/^AUTH:\s*/, ''));
}

function sortVouchers() {
  S.vouchers = [...S.vById.values()].sort((a, b) => a.date < b.date ? -1 : a.date > b.date ? 1 : (a.seq || 0) - (b.seq || 0) || (a.ca || 0) - (b.ca || 0));
}
function applyVoucher(v, fromSync) {
  if (!v || !v.id) return;
  if (v.fy && v.fy !== S.fy) { if (S.vById.delete(v.id)) sortVouchers(); return; }
  const prev = S.vById.get(v.id);
  if (prev && (prev.rev > v.rev || (prev.rev === v.rev && prev.ua >= v.ua))) return;
  S.vById.set(v.id, v); sortVouchers();
  if (fromSync && S.loaded.all && v.ub && v.ub !== S.uid) { S.fresh.add(v.id); liveToast(v, !prev); }
}
function liveToast(v, isNew) {
  const verb = v.status === 'cancelled' ? 'cancelled' : isNew ? 'saved' : 'updated';
  const by = v.ub === 'Google Sheet' || !S.people.has(v.ub) ? (v.ub === 'Google Sheet' ? 'Someone in the Google Sheet' : who(v.ub)) : who(v.ub);
  toast(`${by} ${verb} ${TYPES[v.type].short.toLowerCase()} ${v.no || ''}${TYPES[v.type].trade ? ' for ' + partyName(v) + ', ₹' + money(vAmount(v)) : ''}`, 'live');
}
function applySetting(key, value) {
  if (key === 'company') S.company = value && Object.keys(value).length && value.name ? value : null;
  if (key === 'sysob') S.sysob = value || {};
  if (key === 'lock') S.lock = (value && value.until) || null;
}
function applyRole(role) {
  S.role = role || 'pending';
  S.canWrite = ['owner', 'admin', 'staff'].includes(S.role);
  S.canAdmin = ['owner', 'admin'].includes(S.role);
}
function applyProfile(p) {
  S.people.set(p.id, p); S.names[p.id] = p.name || (p.email || '').split('@')[0];
  if (p.id === S.uid && p.role !== S.role && S.loaded.all) { applyRole(p.role); toast(`Your access is now: ${ROLE_LABEL[p.role] || p.role}.`); }
}

/* ---------- sync: polls the Sheet every few seconds; only changes come back ---------- */
let pollT = null, syncing = null, failures = 0;
const POLL_MS = () => document.visibilityState === 'visible' ? 4000 : 20000;
function stopPolling() { clearTimeout(pollT); pollT = null; }
function schedule(ms) { clearTimeout(pollT); pollT = setTimeout(() => syncNow(), ms); }
function syncNow(full) {
  if (syncing) return syncing;
  const fy = S.fy;
  syncing = (async () => {
    try {
      const r = await call('sync', { fy, ver: full ? {} : S.sv, vv: full ? -1 : S.vv, presence: { view: S.view, doing: S.sheet ? S.sheet.label : null } });
      if (fy !== S.fy) return;
      if (r.me) { if (r.me.role !== S.role) applyRole(r.me.role); }
      if ('company' in r) { applySetting('company', r.company); applySetting('lock', { until: r.lock }); }
      if (r.users) { S.people = new Map(); S.names = {}; for (const p of r.users) applyProfile(p); }
      if (r.items) {
        for (const t of MASTER_TABLES) S[t] = new Map((r[t] || []).map(x => [x.id, x]));
        S.sysob = r.sysob || {};
      }
      if (r.vouchers) {
        if (r.vouchers.full) { S.vById = new Map(r.vouchers.list.map(v => [v.id, v])); sortVouchers(); }
        else for (const v of r.vouchers.list) applyVoucher(v, true);
      }
      S.sv = Object.assign({}, r.ver, { fy }); S.vv = r.vv;
      S.peers = (r.peers || []).map(p => ({ by: p.by, peer: p.by, isMe: p.by === S.uid, kind: 'viewer', presence: p.presence || {} }));
      S.loaded.all = true; S.loadErr = null; S.live = true; S.lastLoad = Date.now(); failures = 0;
    } catch (e) {
      failures++; S.live = false;
      if (!S.loaded.all || failures > 2) S.loadErr = e;
      if (e && e.code === 'AUTH') return;
    } finally {
      syncing = null; bump();
      if (S.token) schedule(failures ? Math.min(30000, 4000 * failures) : POLL_MS());
    }
  })();
  return syncing;
}
const loadAll = () => syncNow(true);
function subscribeLive() { S.sv = {}; S.vv = -1; return syncNow(true); }
function joinPresence() { }
function setPresence() { }
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && S.token && S.loaded.all) syncNow(); });

/* ---------- writes ---------- */
async function writeVoucher(v, expectedRev) {
  S.pending = true; renderStatus();
  try {
    const saved = await call('save_voucher', { p: v, p_expected_rev: expectedRev == null ? null : expectedRev });
    applyVoucher(saved, false); bump(); return S.vById.get(saved.id) || saved;
  } finally { S.pending = false; renderStatus(); }
}
async function setVoucherStatus(v, status) {
  const saved = await call('set_voucher_status', { p_id: v.id, p_status: status, p_expected_rev: v.rev || null });
  applyVoucher(saved, false); bump();
}
async function saveMaster(table, id, data) {
  const merged = await call('save_master', { p_table: table, p_id: id, p_patch: data });
  S[table].set(id, Object.assign({}, merged || data, { id })); bump();
  return merged;
}
async function saveMasters(table, rows, onProgress) {
  let done = 0;
  for (let i = 0; i < rows.length; i += 500) {
    const chunk = rows.slice(i, i + 500);
    await call('save_masters', { p_table: table, p_rows: chunk });
    done += chunk.length; if (onProgress) onProgress(done, rows.length);
  }
  syncNow(); return done;
}
async function deleteMaster(table, id) { await call('delete_master', { p_table: table, p_id: id }); S[table].delete(id); bump(); }
async function saveSetting(key, value) { await call('set_setting', { p_key: key, p_value: value }); applySetting(key, value); bump(); }
async function loadHistory(id) { return call('history', { id }); }

/* =================== start-up, sign-in =================== */
const authShell = (title, body) => {
  const app = document.getElementById('app'); app.className = 'authmode';
  app.innerHTML = `<div class="auth">
    <div class="auth-side"><div class="mark" lang="hi">बही</div><p>Inventory, accounts and billing</p><p class="hi auth-hi" lang="hi">स्टॉक, लेखा और बिलिंग</p></div>
    <div class="auth-main"><div class="auth-card"><h1>${title}</h1>${body}</div></div></div>`;
};
const authMsg = (m, bad) => { const e = $('#au-msg'); if (e) { e.textContent = m; e.className = 'auth-msg' + (bad ? ' bad' : ''); } };
function showLogin(mode = 'in', note = '') {
  const forms = {
    in: ['Sign in', `<form id="au-f"><label class="f">Email<input class="in" type="email" id="au-email" autocomplete="username" required autofocus></label>
      <label class="f">Password<input class="in" type="password" id="au-pass" autocomplete="current-password" required></label>
      <button class="btn primary" type="submit">Sign in</button><p id="au-msg" class="auth-msg${note ? ' bad' : ''}" role="alert">${esc(note)}</p></form>
      <p class="auth-note">No account yet, or forgot your password? Ask an owner or admin of these books to add you or set a temporary password.</p>`],
    newpass: ['Choose your password', `<p class="auth-note" style="margin-top:0">You signed in with a temporary password. Choose your own to continue.</p>
      <form id="au-f"><label class="f">New password<input class="in" type="password" id="au-pass" autocomplete="new-password" minlength="8" required autofocus></label>
      <label class="f">Type it again<input class="in" type="password" id="au-pass2" autocomplete="new-password" minlength="8" required></label>
      <button class="btn primary" type="submit">Save and continue</button><p id="au-msg" class="auth-msg" role="alert"></p></form>`],
  }[mode];
  authShell(forms[0], forms[1]);
  $('#au-f').addEventListener('submit', async e => {
    e.preventDefault(); const btn = e.target.querySelector('button'); btn.disabled = true; authMsg('');
    try {
      if (mode === 'in') {
        const r = await call('login', { email: $('#au-email').value.trim(), password: $('#au-pass').value });
        S.token = r.token; try { localStorage.setItem(TOKEN_KEY, r.token); } catch (x) { }
        if (r.mustChange) { showLogin('newpass'); return; }
        await startApp(); return;
      }
      if (mode === 'newpass') {
        if ($('#au-pass').value !== $('#au-pass2').value) throw { message: 'BAD_INPUT: the two passwords don\u2019t match' };
        await call('change_password', { password: $('#au-pass').value });
        await startApp(); return;
      }
    } catch (err) { authMsg(dbErrMsg(err), true); }
    btn.disabled = false;
  });
}
let started = false;
async function startApp() {
  if (started) return;
  authShell('Opening the books\u2026', '<p class="auth-note">Reading the Google Sheet.</p>');
  S.sv = {}; S.vv = -1;
  try {
    const r = await call('sync', { fy: S.fy, ver: {}, vv: -1, presence: { view: 'dashboard' } });
    S.uid = r.me.id; S.email = r.me.email; applyRole(r.me.role);
  } catch (e) {
    if (e && e.code === 'AUTH') { signedOut(e.message); return; }
    authShell('Can\u2019t open the books', `<p class="auth-msg bad">${esc(dbErrMsg(e))}</p><p class="auth-note">Check the web app address in config.js and that the Apps Script is deployed with access set to Anyone.</p><p class="auth-alt"><a href="#" data-act="retryStart">Try again</a><a href="#" data-act="signOut">Sign out</a></p>`);
    return;
  }
  started = true;
  shell();
  const h = location.hash.slice(1); S.view = VIEWS[h] ? h : 'dashboard';
  try { history.replaceState(null, '', '#' + S.view); } catch (e) { }
  renderAll();
  syncNow(true);
}
ACT.retryStart = () => startApp();
async function boot() {
  if (!CFG.scriptUrl || /PASTE|YOUR-/i.test(CFG.scriptUrl)) {
    authShell('Almost ready', `<p>This copy of Bahi isn\u2019t connected to a Google Sheet yet.</p><p class="auth-note">Open <b>config.js</b>, paste the web app address of your Apps Script deployment, and upload it again. The README explains each step.</p>`);
    return;
  }
  try { S.token = localStorage.getItem(TOKEN_KEY); } catch (e) { S.token = null; }
  if (S.token) await startApp(); else showLogin('in');
}
window.addEventListener('unhandledrejection', e => { console.error(e.reason); });
boot();

</script>
