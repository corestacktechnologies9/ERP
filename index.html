AAAA0000A1Z5.":"यह GSTIN सही नहीं लगता। इसमें 15 अक्षर होते हैं, जैसे 09AAAAA0000A1Z5।","Keep the prefix to 12 characters using letters, numbers, / and -. GST invoice numbers can be at most 16 characters.":"उपसर्ग 12 अक्षरों तक रखें, केवल अक्षर, अंक, / और -। जीएसटी बीजक क्रमांक अधिकतम 16 अक्षर का हो सकता है।","Company details saved":"संस्था विवरण सहेजा गया","Enter your email and password.":"अपना ईमेल और पासवर्ड लिखें।","That email and password don’t match.":"यह ईमेल और पासवर्ड मेल नहीं खाते।","Too many wrong passwords. Wait 15 minutes and try again.":"बहुत बार गलत पासवर्ड। 15 मिनट रुककर फिर प्रयास करें।","Your access has been turned off. Ask an owner or admin.":"आपकी पहुँच बंद कर दी गई है। स्वामी या प्रशासक से संपर्क करें।","Please sign in.":"कृपया साइन इन करें।","Your sign-in has ended. Please sign in again.":"आपका साइन इन समाप्त हो गया। कृपया फिर से साइन इन करें।","Please sign in again.":"कृपया फिर से साइन इन करें।","Your account can only view these books.":"आपका खाता इस बही को केवल देख सकता है।","You have view-only access to these books.":"इस बही में आपकी पहुँच केवल देखने की है।","Only an owner or admin can do this.":"केवल स्वामी या प्रशासक यह कर सकते हैं।","Choose a password of at least 8 characters.":"कम से कम 8 अक्षरों का पासवर्ड चुनें।","Your current password is wrong.":"आपका वर्तमान पासवर्ड गलत है।","Unknown access level.":"अज्ञात पहुँच स्तर।","Person not found.":"व्यक्ति नहीं मिला।","Only an owner can give or take away owner access.":"केवल स्वामी ही स्वामी की पहुँच दे या हटा सकता है।","Make someone else an owner first.":"पहले किसी और को स्वामी बनाएँ।","Enter a name.":"नाम लिखें।","Enter a valid email.":"सही ईमेल लिखें।","Only an owner can add an owner.":"केवल स्वामी ही नया स्वामी जोड़ सकता है।","The temporary password needs at least 8 characters.":"अस्थायी पासवर्ड कम से कम 8 अक्षरों का होना चाहिए।","That email already has an account.":"इस ईमेल का खाता पहले से है।","Only an owner can reset an owner’s password.":"केवल स्वामी ही स्वामी का पासवर्ड रीसेट कर सकता
