<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bahi: inventory, accounts and billing</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%93%92%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anek+Devanagari:wght@400;500;600;700&family=Anek+Latin:wght@400;500;600;700&display=swap">
<style>
:root{
  --paper:#EEF3EC; --sheet:#FFFFFF; --ink:#18232E; --ink2:#4E5D6A; --ink3:#7B8894;
  --rule:#D5DED4; --rule2:#B9C8B8; --band:#F3F8F1; --hover:#E4ECF7;
  --accent:#1E4F91; --accent-ink:#FFFFFF; --accent-soft:#E2EBF7;
  --red:#A8241C; --red-soft:#F9E5E2; --green:#1E6B39; --green-soft:#E0F1E5; --amber:#8F5400; --amber-soft:#FBEFD9;
  --bahi:#7D1A1F; --bahi2:#62141A; --bahi-ink:#F8EBDA; --bahi-dim:#DDBCA8; --thread:#D89A2B;
  --scrim:rgba(24,35,46,.38); --lift:0 10px 34px rgba(24,35,46,.20);
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#111915; --sheet:#17211D; --ink:#E3EBE5; --ink2:#A9B7AE; --ink3:#7D8C84;
    --rule:#28362F; --rule2:#3A4A42; --band:#1A2520; --hover:#1E2C3E;
    --accent:#8DB3EA; --accent-ink:#0D1A2B; --accent-soft:#1D2C42;
    --red:#F0948C; --red-soft:#3A1F1C; --green:#80D49F; --green-soft:#16301F; --amber:#F1C47D; --amber-soft:#382B14;
    --bahi:#4F1015; --bahi2:#3B0B0F; --bahi-ink:#F3E2CD; --bahi-dim:#C7A693; --thread:#C88B25;
    --scrim:rgba(0,0,0,.55); --lift:0 10px 34px rgba(0,0,0,.5);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#111915; --sheet:#17211D; --ink:#E3EBE5; --ink2:#A9B7AE; --ink3:#7D8C84;
  --rule:#28362F; --rule2:#3A4A42; --band:#1A2520; --hover:#1E2C3E;
  --accent:#8DB3EA; --accent-ink:#0D1A2B; --accent-soft:#1D2C42;
  --red:#F0948C; --red-soft:#3A1F1C; --green:#80D49F; --green-soft:#16301F; --amber:#F1C47D; --amber-soft:#382B14;
  --bahi:#4F1015; --bahi2:#3B0B0F; --bahi-ink:#F3E2CD; --bahi-dim:#C7A693; --thread:#C88B25;
  --scrim:rgba(0,0,0,.55); --lift:0 10px 34px rgba(0,0,0,.5);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;background:var(--paper);scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;background:var(--paper);color:var(--ink);
  font-family:"Anek Latin","Anek Devanagari",system-ui,"Segoe UI","Noto Sans Devanagari",Roboto,sans-serif;
  font-size:15px;line-height:1.45;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
.hi,[lang="hi"]{font-family:"Anek Devanagari","Anek Latin","Noto Sans Devanagari",system-ui,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
[hidden]{display:none !important}

/* ---------- sign-in ---------- */
#app.authmode{display:block}
.auth{display:grid;grid-template-columns:minmax(280px,40%) minmax(0,1fr);min-height:100%}
.auth-side{background:var(--bahi);color:var(--bahi-ink);padding:56px 48px;position:relative}
.auth-side::after{content:"";position:absolute;top:0;bottom:0;right:9px;width:2px;background:repeating-linear-gradient(to bottom,var(--thread) 0 9px,transparent 9px 16px);opacity:.75}
.auth-side .mark{font-family:"Anek Devanagari",serif;font-weight:700;font-size:104px;line-height:1}
.auth-side p{margin:14px 0 0;font-size:19px;color:var(--bahi-dim);max-width:24ch}
.auth-side .auth-hi{margin-top:4px;font-size:17px}
.auth-main{display:grid;place-items:center;padding:32px 22px}
.auth-card{width:min(400px,100%)}
.auth-card h1{margin:0 0 18px;font-size:28px;font-weight:650;line-height:1.15}
.auth-card form{display:flex;flex-direction:column;gap:13px}
.auth-card form .btn{justify-content:center;padding:10px 14px;margin-top:4px}
.auth-card p{max-width:60ch}
.auth-msg{min-height:1.3em;font-size:14px;margin:0;color:var(--green)}
.auth-msg.bad{color:var(--red)}
.auth-note{color:var(--ink2);font-size:14px}
.auth-alt{display:flex;gap:20px;flex-wrap:wrap;font-size:14.5px}
@media (max-width:760px){.auth{grid-template-columns:1fr}.auth-side{padding:28px 22px 24px}.auth-side .mark{font-size:60px}.auth-side p{font-size:16px;margin-top:8px}}

/* ---------- frame ---------- */
#app{display:grid;grid-template-columns:250px minmax(0,1fr);height:100%}
#nav{background:var(--bahi);color:var(--bahi-ink);display:flex;flex-direction:column;position:relative;overflow-y:auto;z-index:30}
#nav::after{content:"";position:absolute;top:0;bottom:0;right:7px;width:2px;
  background:repeating-linear-gradient(to bottom,var(--thread) 0 9px,transparent 9px 16px);opacity:.75;pointer-events:none}
.brand{padding:22px 22px 14px}
.brand .mark{font-family:"Anek Devanagari",serif;font-weight:700;font-size:46px;line-height:1;letter-spacing:.5px;font-stretch:112%}
.brand .sub{margin-top:6px;font-size:13px;color:var(--bahi-dim);line-height:1.3}
.navgrp{padding:10px 0 4px}
.navgrp>.gl{padding:6px 22px;font-size:12.5px;color:var(--bahi-dim)}
.navlink{display:flex;align-items:baseline;gap:8px;width:calc(100% - 18px);margin:0 0 1px;padding:7px 14px 7px 22px;border:0;background:none;
  text-align:left;cursor:pointer;border-radius:0 6px 6px 0;color:var(--bahi-ink)}
.navlink>span{white-space:nowrap}
.navlink .h{font-size:12.5px;color:var(--bahi-dim);margin-left:auto}
.navlink:hover{background:rgba(255,255,255,.08)}
.navlink.on{background:rgba(255,255,255,.14);box-shadow:inset 3px 0 0 var(--thread);font-weight:600}
.navlink:focus-visible{outline:2px solid var(--thread);outline-offset:-2px}
.navfoot{margin-top:auto;padding:16px 22px 22px;font-size:13px;color:var(--bahi-dim);line-height:1.4}
.navfoot>div:first-child{color:var(--bahi-ink);font-weight:600}
.navmini{border:1px solid rgba(255,255,255,.28);background:transparent;color:var(--bahi-ink);border-radius:5px;padding:3px 8px;font-size:12.5px;cursor:pointer;margin:2px 0}
.navmini:hover{background:rgba(255,255,255,.1)}

#main{overflow-y:auto;overflow-x:hidden;min-width:0;position:relative}
#top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 26px;background:var(--paper);border-bottom:1px solid var(--rule)}
#top .co{font-weight:650;font-size:16px;font-stretch:92%;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:36ch}
#top .grow{flex:1}
#menuBtn{display:none}
.fysel{padding:5px 8px;border:1px solid var(--rule2);border-radius:5px;background:var(--sheet)}
.sync{display:inline-flex;align-items:center;gap:7px;font-size:13px;color:var(--ink2);white-space:nowrap}
.sync .dot{width:9px;height:9px;border-radius:50%;background:var(--ink3)}
.sync.live .dot{background:var(--green);box-shadow:0 0 0 0 color-mix(in srgb,var(--green) 60%,transparent);animation:beat 2.4s ease-out infinite}
.sync.saving .dot{background:var(--amber)}
.sync.err .dot,.sync.slow .dot{background:var(--red)}
@keyframes beat{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--green) 55%,transparent)}70%{box-shadow:0 0 0 7px transparent}100%{box-shadow:0 0 0 0 transparent}}
@media (prefers-reduced-motion:reduce){.sync.live .dot{animation:none}*{transition:none !important}}
.peers{display:flex;align-items:center}
.av{width:28px;height:28px;border-radius:50%;display:inline-grid;place-items:center;font-size:12px;font-weight:650;color:#fff;border:2px solid var(--paper);margin-left:-7px;cursor:default}
.av:first-child{margin-left:0}
.av.me{outline:2px solid var(--accent);outline-offset:-1px}

#view{padding:22px 26px 60px;max-width:1500px}
.ph{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-bottom:14px}
.ph h1{margin:0;font-size:27px;line-height:1.1;font-weight:650;font-stretch:88%;letter-spacing:-.2px}
.ph h1 .hi{font-size:17px;font-weight:500;color:var(--ink2);margin-left:8px;font-stretch:100%;letter-spacing:0}
.ph .acts{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.lead{color:var(--ink2);margin:-6px 0 16px;max-width:75ch}

/* ---------- controls ---------- */
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 13px;border:1px solid var(--rule2);background:var(--sheet);border-radius:6px;cursor:pointer;white-space:nowrap;line-height:1.25}
.btn:hover{border-color:var(--ink3)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.primary:hover{filter:brightness(1.07)}
.btn.danger{color:var(--red)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.sm{padding:4px 9px;font-size:13.5px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.in,select.in,textarea.in{width:100%;padding:7px 9px;border:1px solid var(--rule2);border-radius:5px;background:var(--sheet);min-width:0}
.in:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
textarea.in{resize:vertical;min-height:62px}
label.f{display:flex;flex-direction:column;gap:3px;font-size:13px;color:var(--ink2);min-width:0}
label.f>.in,label.f>select,label.f>.combo{color:var(--ink);font-size:15px}
label.ck{display:flex;align-items:center;gap:8px;font-size:14px;cursor:pointer}
.fields{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px 14px}
.fields .s2{grid-column:span 2}.fields .s4{grid-column:1/-1}
.bar{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap;margin:0 0 14px}
.bar label.f{min-width:140px}
.bar .q{min-width:220px;flex:1;max-width:360px}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--rule2);margin:0 0 14px;overflow-x:auto}
.tab{border:0;background:none;padding:8px 14px;cursor:pointer;color:var(--ink2);border-bottom:2.5px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tab.on{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
.chip{display:inline-block;padding:1px 7px;border-radius:4px;font-size:12.5px;background:var(--band);color:var(--ink2);white-space:nowrap}
.chip.red{background:var(--red-soft);color:var(--red)}.chip.green{background:var(--green-soft);color:var(--green)}.chip.amber{background:var(--amber-soft);color:var(--amber)}.chip.blue{background:var(--accent-soft);color:var(--accent)}
.muted{color:var(--ink3)}.neg{color:var(--red)}.pos{color:var(--green)}
.banner{padding:10px 14px;border-radius:6px;margin:0 0 14px;background:var(--amber-soft);color:var(--amber);border:1px solid color-mix(in srgb,var(--amber) 30%,transparent)}
.banner.red{background:var(--red-soft);color:var(--red);border-color:color-mix(in srgb,var(--red) 30%,transparent)}
.banner.blue{background:var(--accent-soft);color:var(--accent);border-color:color-mix(in srgb,var(--accent) 30%,transparent)}
.banner .btn{margin-left:8px}

/* ---------- ledger tables ---------- */
.tw{overflow-x:auto;background:var(--sheet);border:1px solid var(--rule);border-radius:6px}
table.lg{width:100%;border-collapse:collapse;font-size:14.5px}
table.lg th{text-align:left;font-weight:600;color:var(--ink2);padding:8px 10px;border-bottom:1.5px solid var(--rule2);white-space:nowrap;background:var(--sheet);position:sticky;top:0}
table.lg td{padding:6px 10px;border-bottom:1px solid var(--rule);vertical-align:top}
table.lg tbody tr:nth-child(6n+1) td,table.lg tbody tr:nth-child(6n+2) td,table.lg tbody tr:nth-child(6n+3) td{background:var(--band)}
table.lg tbody tr.click{cursor:pointer}
table.lg tbody tr.click:hover td{background:var(--hover)}
table.lg tr.grp td{background:var(--sheet) !important;font-weight:650;padding-top:12px;border-bottom:1px solid var(--rule2)}
table.lg tr.sub td{color:var(--ink2)}
table.lg tr.cx td{color:var(--ink3);text-decoration:line-through;text-decoration-color:color-mix(in srgb,var(--red) 60%,transparent)}
table.lg tr.cx td:last-child,table.lg tr.cx td.keep{text-decoration:none}
table.lg tfoot td{padding:8px 10px;font-weight:650;border-top:3px double var(--ink2);background:var(--sheet)}
.num{text-align:right !important;white-space:nowrap}
th.num{text-align:right}
td.w{white-space:nowrap}
.cap{font-size:13px;color:var(--ink3);margin:8px 2px}
.empty{padding:36px 20px;text-align:center;color:var(--ink2)}
.empty p{margin:0 0 12px}

/* ---------- dashboard ---------- */
.daysheet{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));background:var(--sheet);border:1px solid var(--rule);border-radius:6px;margin-bottom:18px}
.daysheet>div{padding:14px 16px;border-right:1px solid var(--rule)}
.daysheet>div:last-child{border-right:0}
.daysheet .k{font-size:13px;color:var(--ink2)}
.daysheet .v{font-size:24px;font-weight:650;font-stretch:90%;margin-top:2px;white-space:nowrap}
.daysheet .n{font-size:12.5px;color:var(--ink3)}
.cols{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:18px;align-items:start}
.cols.cb{grid-template-columns:minmax(0,2.2fr) minmax(0,1fr)}
.daysheet.four{grid-template-columns:repeat(4,minmax(0,1fr))}
.box{background:var(--sheet);border:1px solid var(--rule);border-radius:6px;padding:14px 16px;margin-bottom:18px}
.box h3{margin:0 0 10px;font-size:16px;font-weight:650}
.feed{list-style:none;margin:0;padding:0}
.feed li{display:flex;gap:10px;padding:7px 0;border-bottom:1px solid var(--rule);font-size:14px;align-items:baseline}
.feed li:last-child{border-bottom:0}
.feed .t{margin-left:auto;color:var(--ink3);font-size:12.5px;white-space:nowrap}
.feed li.new{animation:flash 2.2s ease-out}
@keyframes flash{from{background:var(--accent-soft)}to{background:transparent}}
.chart svg{width:100%;height:auto;display:block}
.chart .bar-r{fill:var(--accent)}
.chart .bar-r.today{fill:var(--thread)}
.chart text{fill:var(--ink3);font-size:11px;font-family:inherit}
.chart line{stroke:var(--rule)}

/* ---------- T-format statements ---------- */
.tform{display:grid;grid-template-columns:1fr 1fr;gap:0;background:var(--sheet);border:1px solid var(--rule);border-radius:6px;overflow:hidden}
.tform>div:first-child{border-right:1.5px solid var(--rule2)}
.tform table.lg{font-size:14.5px}
.tform .tw{border:0;border-radius:0}

/* ---------- sheet & dialog ---------- */
#scrim{position:fixed;inset:0;background:var(--scrim);z-index:40}
#sheet{position:fixed;top:0;right:0;bottom:0;width:min(1180px,100%);background:var(--sheet);z-index:41;display:flex;flex-direction:column;box-shadow:var(--lift);
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.sh-h{display:flex;align-items:flex-start;gap:12px;padding:16px 22px 12px;border-bottom:1px solid var(--rule)}
.sh-h h2{margin:0;font-size:22px;font-weight:650;font-stretch:90%}
.sh-h h2 .hi{font-size:15px;color:var(--ink2);font-weight:500;margin-left:6px;font-stretch:100%}
.sh-h .sub{font-size:13.5px;color:var(--ink2);margin-top:2px}
.sh-h .x{margin-left:auto}
.sh-b{flex:1;overflow:auto;padding:16px 22px}
.sh-f{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:12px 22px;border-top:1px solid var(--rule);background:var(--paper)}
.sh-f .err{color:var(--red);font-size:14px;margin-right:auto;min-width:0}
.sh-f .sp{margin-right:auto}
.kbd{font-size:12px;color:var(--ink3)}
#dialog{position:fixed;inset:0;z-index:60;display:grid;place-items:center;background:var(--scrim);padding:16px}
.dlg{background:var(--sheet);border-radius:8px;box-shadow:var(--lift);width:min(600px,100%);max-height:calc(100% - 24px);display:flex;flex-direction:column}
.dlg.wide{width:min(980px,100%)}
.dlg .sh-b{padding:14px 20px}
.dlg .sh-h{padding:14px 20px 10px}
.dlg .sh-f{padding:10px 20px;border-radius:0 0 8px 8px}

/* entry grid */
table.entry td{padding:4px 5px;vertical-align:top}
table.entry tbody tr td{background:var(--sheet) !important}
table.entry .in{padding:6px 7px}
table.entry td.n{color:var(--ink3);padding-top:10px;width:30px}
table.entry td.unit{padding-top:10px;color:var(--ink2)}
table.entry td.calc{padding-top:10px}
table.entry small{display:block;font-size:12px;margin-top:2px;color:var(--ink3)}
table.entry small.short{color:var(--red);font-weight:600}
.xb{border:0;background:none;color:var(--ink3);font-size:20px;line-height:1;cursor:pointer;padding:4px 8px;border-radius:4px}
.xb:hover{color:var(--red);background:var(--red-soft)}
.scan{display:flex;gap:10px;align-items:center;margin:14px 0 8px}
.scan .in{max-width:440px}
.tfoot{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:22px;margin-top:16px;align-items:start}
table.tot{width:100%;border-collapse:collapse;font-size:15px}
table.tot td{padding:5px 4px;border-bottom:1px solid var(--rule)}
table.tot tr.gt td{font-size:20px;font-weight:700;border-top:3px double var(--ink2);border-bottom:0;padding-top:8px}
.words{font-size:13px;color:var(--ink2);margin-top:8px;line-height:1.4}

/* combobox */
.combo{position:relative}
.cl{position:fixed;z-index:80;background:var(--sheet);border:1px solid var(--rule2);border-radius:6px;box-shadow:var(--lift);max-height:300px;overflow:auto;min-width:260px}
.cl .o{padding:7px 11px;cursor:pointer;display:flex;gap:10px;align-items:baseline;border-bottom:1px solid var(--rule)}
.cl .o:last-child{border-bottom:0}
.cl .o .s{font-size:12.5px;color:var(--ink3)}
.cl .o .r{margin-left:auto;font-size:12.5px;color:var(--ink2);white-space:nowrap}
.cl .o.on{background:var(--accent-soft)}
.cl .o.add{color:var(--accent);font-weight:600}
.cl .none{padding:9px 11px;color:var(--ink3);font-size:14px}

/* toasts */
#toasts{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:90;transition:bottom .15s;display:flex;flex-direction:column;gap:8px;max-width:min(420px,calc(100% - 36px))}
.toast{background:var(--ink);color:var(--paper);padding:10px 14px;border-radius:6px;box-shadow:var(--lift);font-size:14px}
.toast.err{background:var(--red);color:#fff}
.toast.live{border-left:4px solid var(--thread)}

body.sheet-open #toasts,body.dlg-open #toasts{bottom:calc(76px + env(safe-area-inset-bottom,0px))}
body.sheet-open #toasts{right:auto;left:18px}
#print-area{display:none}
@media print{
  body>*:not(#print-area){display:none !important}
  body::before{display:none}
  #print-area{display:block}
  html,body{background:#fff;height:auto}
  :root{padding:0}
}

/* ---------- responsive ---------- */
@media (max-width:1100px){
  .daysheet{grid-template-columns:repeat(3,minmax(0,1fr))}
  .daysheet>div:nth-child(3){border-right:0}
  .daysheet>div:nth-child(-n+3){border-bottom:1px solid var(--rule)}
  .cols,.cols.cb{grid-template-columns:1fr}
  .daysheet.four{grid-template-columns:repeat(2,minmax(0,1fr))}
  .daysheet.four>div{border-right:0;border-bottom:1px solid var(--rule)}
  .tfoot{grid-template-columns:1fr}
}
@media (max-width:860px){
  #app{grid-template-columns:minmax(0,1fr)}
  #nav{position:fixed;top:0;bottom:0;left:0;width:264px;transform:translateX(-100%);transition:transform .2s ease;padding-top:env(safe-area-inset-top,0px)}
  body.navopen #nav{transform:none;box-shadow:var(--lift)}
  #menuBtn{display:inline-flex}
  #top{padding:8px 14px;gap:8px}
  #top .co{max-width:20ch;font-size:15px}
  #view{padding:16px 14px 60px}
  .fields{grid-template-columns:repeat(2,minmax(0,1fr))}

<script>
'use strict';
/* =========================================================
   Bahi — inventory, accounts and billing
   Single source of truth = vouchers. Stock, ledgers, GST and
   every report are derived live from them, so any entry made
   by anyone shows up everywhere the moment it is saved.
   ========================================================= */

/* ---------- utilities ---------- */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const r2 = n => { n = Number(n) || 0; const s = n < 0 ? -1 : 1; return s * Math.round(Math.abs(n) * 100 + 1e-7) / 100; };

const NF2 = new Intl.NumberFormat('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const NFQ = new Intl.NumberFormat('en-IN', { maximumFractionDigits: 3 });

const drcr = n => { n = r2(n); return n === 0 ? '0.00' : money(Math.abs(n)) + (n > 0 ? ' Dr' : ' Cr'); };
const pad = n => String(n).padStart(2, '0');
const dstr = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const today = () => dstr(new Date());
const addDays = (s, n) => { const d = new Date(s + 'T00:00:00'); d.setDate(d.getDate() + n); return dstr(d); };
const dayDiff = (a, b) => Math.round((new Date(b + 'T00:00:00') - new Date(a + 'T00:00:00')) / 864e5);
const dmy = s => s ? `${s.slice(8, 10)}-${s.slice(5, 7)}-${s.slice(0, 4)}` : '';
const MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
const dmon = s => s ? `${+s.slice(8, 10)} ${MON[+s.slice(5, 7) - 1]}` : '';
const fyOf = s => { const y = +s.slice(0, 4), m = +s.slice(5, 7), a = m >= 4 ? y : y - 1; return `${a}-${pad((a + 1) % 100)}`; };
const fyStart = fy => `${fy.slice(0, 4)}-04-01`;
const fyEnd = fy => `${+fy.slice(0, 4) + 1}-03-31`;
const fyShift = (fy, n) => { const a = +fy.slice(0, 4) + n; return `${a}-${pad((a + 1) % 100)}`; };
const fyShort = fy => fy.slice(2);
const MAXD = '9999-12-31';
const newId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const hash = s => { let h = 0x811c9dc5; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 0x01000193) >>> 0; } return h.toString(36); };
const sleep = ms => new Promise(r => setTimeout(r, ms));
const clone = o => JSON.parse(JSON.stringify(o));
const num = v => { const n = parseFloat(String(v ?? '').replace(/,/g, '')); return isFinite(n) ? n : 0; };
const ago = ms => {
  if (!ms) return '';
  const s = Math.max(0, (Date.now() - ms) / 1000);
  if (s < 45) return 'just now';
  if (s < 3600) return Math.round(s / 60) + ' min ago';
  if (s < 86400) return Math.round(s / 3600) + ' h ago';

};
const tm = ms => { if (!ms) return ''; const d = new Date(ms); return `${dmy(dstr(d))} ${pad(d.getHours())}:${pad(d.getMinutes())}`; };

/* ---------- amount in words (Indian system) ---------- */
const EN1 = ['', 'One', 'Two', 'Three', 'Four', 'Five', 'Six', 'Seven', 'Eight', 'Nine', 'Ten', 'Eleven', 'Twelve', 'Thirteen', 'Fourteen', 'Fifteen', 'Sixteen', 'Seventeen', 'Eighteen', 'Nineteen'];
const EN10 = ['', '', 'Twenty', 'Thirty', 'Forty', 'Fifty', 'Sixty', 'Seventy', 'Eighty', 'Ninety'];
const en2 = n => n < 20 ? EN1[n] : EN10[Math.floor(n / 10)] + (n % 10 ? ' ' + EN1[n % 10] : '');
const en3 = n => { const h = Math.floor(n / 100), r = n % 100; return (h ? EN1[h] + ' Hundred' + (r ? ' ' : '') : '') + (r ? en2(r) : ''); };
function intEn(n) {
  if (n === 0) return 'Zero';
  const p = []; const cr = Math.floor(n / 1e7); if (cr) { p.push(intEn(cr) + ' Crore'); n %= 1e7; }
  const l = Math.floor(n / 1e5); if (l) { p.push(en2(l) + ' Lakh'); n %= 1e5; }
  const t = Math.floor(n / 1e3); if (t) { p.push(en2(t) + ' Thousand'); n %= 1e3; }
  if (n) p.push(en3(n)); return p.join(' ');
}
const HI = ('शून्य एक दो तीन चार पाँच छह सात आठ नौ दस ग्यारह बारह तेरह चौदह पंद्रह सोलह सत्रह अठारह उन्नीस बीस ' +
  'इक्कीस बाईस तेईस चौबीस पच्चीस छब्बीस सत्ताईस अट्ठाईस उनतीस तीस इकतीस बत्तीस तैंतीस चौंतीस पैंतीस छत्तीस सैंतीस अड़तीस उनतालीस चालीस ' +
  'इकतालीस बयालीस तैंतालीस चवालीस पैंतालीस छियालीस सैंतालीस अड़तालीस उनचास पचास इक्यावन बावन तिरपन चौवन पचपन छप्पन सत्तावन अट्ठावन उनसठ साठ ' +
  'इकसठ बासठ तिरसठ चौंसठ पैंसठ छियासठ सड़सठ अड़सठ उनहत्तर सत्तर इकहत्तर बहत्तर तिहत्तर चौहत्तर पचहत्तर छिहत्तर सतहत्तर अठहत्तर उन्यासी अस्सी ' +
  'इक्यासी बयासी तिरासी चौरासी पचासी छियासी सत्तासी अट्ठासी नवासी नब्बे इक्यानवे बानवे तिरानवे चौरानवे पंचानवे छियानवे सत्तानवे अट्ठानवे निन्यानवे').split(' ');
function intHi(n) {
  if (n === 0) return HI[0];
  const p = []; const cr = Math.floor(n / 1e7); if (cr) { p.push(intHi(cr) + ' करोड़'); n %= 1e7; }
  const l = Math.floor(n / 1e5); if (l) { p.push(HI[l] + ' लाख'); n %= 1e5; }
  const t = Math.floor(n / 1e3); if (t) { p.push(HI[t] + ' हज़ार'); n %= 1e3; }
  const h = Math.floor(n / 100); if (h) { p.push(HI[h] + ' सौ'); n %= 100; }
  if (n) p.push(HI[n]); return p.join(' ');
}
function wordsEn(a) { a = Math.abs(r2(a)); const r = Math.floor(a), p = Math.round((a - r) * 100); return `Rupees ${intEn(r)}${p ? ' and ' + en2(p) + ' Paise' : ''} Only`; }
function wordsHi(a) { a = Math.abs(r2(a)); const r = Math.floor(a), p = Math.round((a - r) * 100); return `रुपये ${intHi(r)}${p ? ' और ' + HI[p] + ' पैसे' : ''} मात्र`; }

/* ---------- reference data ---------- */
const STATES = [['01', 'Jammu & Kashmir'], ['02', 'Himachal Pradesh'], ['03', 'Punjab'], ['04', 'Chandigarh'], ['05', 'Uttarakhand'], ['06', 'Haryana'], ['07', 'Delhi'], ['08', 'Rajasthan'], ['09', 'Uttar Pradesh'], ['10', 'Bihar'], ['11', 'Sikkim'], ['12', 'Arunachal Pradesh'], ['13', 'Nagaland'], ['14', 'Manipur'], ['15', 'Mizoram'], ['16', 'Tripura'], ['17', 'Meghalaya'], ['18', 'Assam'], ['19', 'West Bengal'], ['20', 'Jharkhand'], ['21', 'Odisha'], ['22', 'Chhattisgarh'], ['23', 'Madhya Pradesh'], ['24', 'Gujarat'], ['26', 'Dadra & Nagar Haveli and Daman & Diu'], ['27', 'Maharashtra'], ['29', 'Karnataka'], ['30', 'Goa'], ['31', 'Lakshadweep'], ['32', 'Kerala'], ['33', 'Tamil Nadu'], ['34', 'Puducherry'], ['35', 'Andaman & Nicobar Islands'], ['36', 'Telangana'], ['37', 'Andhra Pradesh'], ['38', 'Ladakh'], ['97', 'Other Territory']];
const stateName = c => (STATES.find(s => s[0] === c) || [, ''])[1];
const stateOpts = (sel, blank) => (blank ? `<option value="">${esc(blank)}</option>` : '') + STATES.map(([c, n]) => `<option value="${c}"${c === sel ? ' selected' : ''}>${c} ${esc(n)}</option>`).join('');
const GST_RATES = [0, 0.25, 3, 5, 12, 18, 28, 40];
const UNITS = ['NOS', 'PCS', 'SET', 'BOX', 'PKT', 'BDL', 'DOZ', 'KGS', 'GMS', 'LTR', 'MTR', 'REM', 'ROL', 'SHT'];
const GSTIN_RE = /^[0-9]{2}[A-Z]{5}[0-9]{4}[A-Z][1-9A-Z]Z[0-9A-Z]$/;

const GROUPS = {
  cash: { name: 'Cash-in-hand', side: 'A' }, bank: { name: 'Bank accounts', side: 'A' }, debtors: { name: 'Sundry debtors', side: 'A' },
  cur_assets: { name: 'Current assets', side: 'A' }, fixed: { name: 'Fixed assets', side: 'A' },
  capital: { name: 'Capital account', side: 'L' }, loans: { name: 'Loans (liability)', side: 'L' }, creditors: { name: 'Sundry creditors', side: 'L' },
  duties: { name: 'Duties & taxes', side: 'L' }, cur_liab: { name: 'Current liabilities', side: 'L' },
  sales: { name: 'Sales accounts', side: 'I', trade: true }, dir_inc: { name: 'Direct income', side: 'I', trade: true }, ind_inc: { name: 'Indirect income', side: 'I' },
  purchase: { name: 'Purchase accounts', side: 'E', trade: true }, dir_exp: { name: 'Direct expenses', side: 'E', trade: true }, ind_exp: { name: 'Indirect expenses', side: 'E' },
};
const isBS = g => GROUPS[g] && (GROUPS[g].side === 'A' || GROUPS[g].side === 'L');
const SYS = {
  CASH: { name: 'Cash in hand', group: 'cash' }, CAPITAL: { name: 'Capital account', group: 'capital' },
  SALES: { name: 'Sales', group: 'sales' }, SRET: { name: 'Sales returns', group: 'sales' },
  PUR: { name: 'Purchases', group: 'purchase' }, PRET: { name: 'Purchase returns', group: 'purchase' },
  OCGST: { name: 'Output CGST', group: 'duties' }, OSGST: { name: 'Output SGST', group: 'duties' }, OIGST: { name: 'Output IGST', group: 'duties' },
  ICGST: { name: 'Input CGST', group: 'duties' }, ISGST: { name: 'Input SGST', group: 'duties' }, IIGST: { name: 'Input IGST', group: 'duties' },
  ROUND: { name: 'Round off', group: 'ind_exp' },
};
const TYPES = {
  sale: { label: 'Sales invoice', short: 'Invoice', hi: 'बिक्री बीजक', series: 'INV', trade: true, nav: 'sales', out: true },
  sret: { label: 'Credit note', short: 'Credit note', hi: 'बिक्री वापसी', series: 'CN', trade: true, nav: 'sales' },
  purchase: { label: 'Purchase bill', short: 'Purchase', hi: 'खरीद', series: 'PUR', trade: true, nav: 'purchases' },
  pret: { label: 'Debit note', short: 'Debit note', hi: 'खरीद वापसी', series: 'DN', trade: true, nav: 'purchases', out: true },
  receipt: { label: 'Receipt', short: 'Receipt', hi: 'प्राप्ति', series: 'RCT', nav: 'cashbank' },
  payment: { label: 'Payment', short: 'Payment', hi: 'भुगतान', series: 'PMT', nav: 'cashbank' },
  contra: { label: 'Contra', short: 'Contra', hi: 'कॉन्ट्रा', series: 'CON', nav: 'cashbank' },
  journal: { label: 'Journal', short: 'Journal', hi: 'जर्नल', series: 'JV', nav: 'cashbank' },
  stock: { label: 'Stock adjustment', short: 'Stock adj.', hi: 'स्टॉक समायोजन', series: 'SJ', nav: 'inventory' },
};

/* ---------- state ---------- */
const S = {
  sb: null, chan: null, pres: null, live: false, loadErr: null, lastLoad: 0,
  uid: null, email: '', role: 'none', canWrite: false, canAdmin: false,
  fy: fyOf(today()),
  company: null, sysob: {}, lock: null,
  items: new Map(), parties: new Map(), ledgers: new Map(), people: new Map(),
  vouchers: [], vById: new Map(), fresh: new Set(),
  loaded: { all: false }, pending: false, ver: 0,
  peers: [], names: {},
  view: 'dashboard', f: {}, sheet: null, dialog: null,
};
const ready = () => Object.values(S.loaded).every(Boolean);

/* ---------- people ---------- */
function who(id) {
  if (!id) return 'Someone';
  if (id === S.uid) return 'You';
  return S.names[id] || 'Someone';
}
const initials = s => (s || '?').split(/\s+/).filter(Boolean).slice(0, 2).map(w => w[0]).join('').toUpperCase() || '?';
const hue = id => parseInt(hash(id || 'x'), 36) % 360;

/* ---------- ledgers ---------- */
function ledgerOf(key) {
  const k = key.slice(0, 1), id = key.slice(2);
  if (k === 'S') { const s = SYS[id]; return { key, name: s ? s.name : id, group: s ? s.group : 'ind_exp', kind: 'sys' }; }
  if (k === 'P') { const p = S.parties.get(id); return { key, name: p ? p.name : '(deleted party)', group: p ? p.group : 'debtors', kind: 'party', ref: p }; }
  const l = S.ledgers.get(id); return { key, name: l ? l.name : '(deleted ledger)', group: l ? l.group : 'ind_exp', kind: 'ledger', ref: l };
}
const lname = key => key ? ledgerOf(key).name : '';
function allLedgerKeys() {
  return [...Object.keys(SYS).map(k => 'S:' + k), ...[...S.ledgers.keys()].map(k => 'L:' + k), ...[...S.parties.keys()].map(k => 'P:' + k)];
}
function openingOf(key, fy = S.fy) {
  const k = key.slice(0, 1), id = key.slice(2);
  if (k === 'S') return num(S.sysob && S.sysob[fy] && S.sysob[fy][id]);
  const rec = k === 'P' ? S.parties.get(id) : S.ledgers.get(id);
  return num(rec && rec.ob && rec.ob[fy]);
}
const cashBankKeys = () => ['S:CASH', ...[...S.ledgers.values()].filter(l => l.group === 'bank' || l.group === 'cash').sort((a, b) => a.name.localeCompare(b.name)).map(l => 'L:' + l.id)];
const partyName = v => v.party ? lname(v.party) : ((v.pSnap && v.pSnap.name) || (TYPES[v.type] && TYPES[v.type].trade ? 'Cash sale' : '—'));

/* ---------- vouchers: computation ---------- */
function calcTrade(v) {
  const inter = !!v.inter; let taxable = 0, cgst = 0, sgst = 0, igst = 0, q = 0;
  for (const l of v.lines) {
    const qty = num(l.qty), rate = num(l.rate), d = num(l.disc), g = num(l.gst);
    const gross = qty * rate * (1 - d / 100);
    const tx = r2(v.incl ? gross / (1 + g / 100) : gross);
    const t = r2(v.incl ? gross - tx : tx * g / 100);
    l.taxable = tx; l.tax = t; l.amount = r2(tx + t);
    if (inter) { l.igst = t; l.cgst = 0; l.sgst = 0; } else { l.cgst = r2(t / 2); l.sgst = r2(t - l.cgst); l.igst = 0; }
    taxable += tx; cgst += l.cgst; sgst += l.sgst; igst += l.igst; q += qty;
  }
  taxable = r2(taxable); cgst = r2(cgst); sgst = r2(sgst); igst = r2(igst);
  const gross = r2(taxable + cgst + sgst + igst);
  const total = v.round === false ? gross : Math.round(gross);
  return { taxable, cgst, sgst, igst, round: r2(total - gross), total: r2(total), qty: r3(q) };
}
const vAmount = v => TYPES[v.type] && TYPES[v.type].trade ? num(v.totals && v.totals.total)
  : v.type === 'stock' ? 0 : r2((v.entries || []).reduce((a, e) => a + num(e.dr), 0));

function postings(v) {
  if (!v || v.status === 'cancelled' || v._x) return [];
  const out = []; const add = (k, a) => { a = r2(a); if (k && a) out.push([k, a]); };
  if (TYPES[v.type] && TYPES[v.type].trade) {
    const t = v.totals || {};
    const sign = (v.type === 'sale' || v.type === 'pret') ? 1 : -1;
    const party = v.party || v.payLedger || 'S:CASH';
    const main = { sale: 'S:SALES', purchase: 'S:PUR', sret: 'S:SRET', pret: 'S:PRET' }[v.type];
    const outward = v.type === 'sale' || v.type === 'sret';
    const [kc, ks, ki] = outward ? ['S:OCGST', 'S:OSGST', 'S:OIGST'] : ['S:ICGST', 'S:ISGST', 'S:IIGST'];
    add(party, sign * num(t.total));
    add(main, -sign * num(t.taxable));
    add(kc, -sign * num(t.cgst)); add(ks, -sign * num(t.sgst)); add(ki, -sign * num(t.igst));
    add('S:ROUND', -sign * num(t.round));
    if (v.party && num(v.paid) > 0 && v.payLedger) { add(v.party, -sign * num(v.paid)); add(v.payLedger, sign * num(v.paid)); }
  } else if (v.entries) {
    for (const e of v.entries) add(e.l, num(e.dr) - num(e.cr));
  }
  return out;
}

/* memo keyed on data version */
let MEMO = { ver: -1 };
function memo(key, fn) { if (MEMO.ver !== S.ver) MEMO = { ver: S.ver }; if (!(key in MEMO)) MEMO[key] = fn(); return MEMO[key]; }
const active = () => memo('active', () => S.vouchers.filter(v => v.status !== 'cancelled'));

function balances(upto = MAXD, from = null) {
  return memo(`bal:${from}:${upto}`, () => {
    const m = new Map();
    if (!from) for (const k of allLedgerKeys()) m.set(k, openingOf(k));
    for (const v of active()) {
      if (v.date > upto || (from && v.date < from)) continue;
      for (const [k, a] of postings(v)) m.set(k, (m.get(k) || 0) + a);
    }
    for (const [k, a] of m) m.set(k, r2(a));
    return m;
  });
}

function stock(upto = MAXD) {
  return memo('stk:' + upto, () => {
    const m = new Map();
    const blank = (id, it) => {
      const ob = (it && it.ob && it.ob[S.fy]) || {};
      const oq = num(ob.q), orate = num(ob.r);
      return { id, oq, orate, ov: r2(oq * orate), pq: 0, pv: 0, rq: 0, rv: 0, sq: 0, sv: 0, srq: 0, aq: 0, last: null };
    };
    for (const [id, it] of S.items) m.set(id, blank(id, it));
    for (const v of active()) {
      if (v.date > upto) continue;
      const lines = v.type === 'stock' ? (v.adj || []) : (TYPES[v.type] && TYPES[v.type].trade ? v.lines || [] : []);
      for (const l of lines) {
        if (!l.item) continue;
        if (!m.has(l.item)) m.set(l.item, blank(l.item, null));
        const e = m.get(l.item), q = num(l.qty);
        if (v.type === 'sale') { e.sq += q; e.sv += num(l.taxable); }
        else if (v.type === 'purchase') { e.pq += q; e.pv += num(l.taxable); }
        else if (v.type === 'sret') e.srq += q;
        else if (v.type === 'pret') { e.rq += q; e.rv += num(l.taxable); }
        else if (v.type === 'stock') e.aq += q;
        if (!e.last || v.date > e.last) e.last = v.date;
      }
    }
    let total = 0;
    for (const [id, e] of m) {
      const it = S.items.get(id) || {};
      e.inq = r3(e.pq + e.srq + Math.max(e.aq, 0));
      e.outq = r3(e.sq + e.rq + Math.max(-e.aq, 0));
      e.q = r3(e.oq + e.pq - e.rq - e.sq + e.srq + e.aq);
      const bq = e.oq + e.pq - e.rq, bv = e.ov + e.pv - e.rv;
      e.avg = bq > 0 && bv > 0 ? bv / bq : (e.orate || num(it.pr) || 0);
      e.value = e.q > 0 ? r2(e.q * e.avg) : 0;
      total += e.value;
    }
    m.total = r2(total);
    m.opening = r2([...m.values()].reduce((a, e) => a + e.ov, 0));
    return m;
  });
}
const stockQty = id => { const e = stock().get(id); return e ? e.q : 0; };

/* ---------- reports engine ---------- */
function plStatement(to) {
  return memo('pl:' + to, () => {
    const bal = balances(to); const st = stock(to);
    const g = { sales: [], dir_inc: [], ind_inc: [], purchase: [], dir_exp: [], ind_exp: [] };
    for (const [k, a] of bal) {
      if (!a) continue; const L = ledgerOf(k);
      let grp = L.group;
      if (grp === 'ind_exp' && a < 0) grp = 'ind_inc';
      else if (grp === 'ind_inc' && a > 0) grp = 'ind_exp';
      if (g[grp]) g[grp].push({ key: k, name: L.name, amt: a });
    }
    const sumCr = arr => r2(arr.reduce((s, x) => s - x.amt, 0));
    const sumDr = arr => r2(arr.reduce((s, x) => s + x.amt, 0));
    const salesNet = sumCr(g.sales), dirInc = sumCr(g.dir_inc), purNet = sumDr(g.purchase), dirExp = sumDr(g.dir_exp);
    const opening = st.opening, closing = st.total;
    const gross = r2(salesNet + dirInc + closing - opening - purNet - dirExp);
    const indInc = sumCr(g.ind_inc), indExp = sumDr(g.ind_exp);
    const net = r2(gross + indInc - indExp);
    return { g, salesNet, dirInc, purNet, dirExp, opening, closing, gross, indInc, indExp, net };
  });
}
function balanceSheet(to) {
  return memo('bs:' + to, () => {
    const bal = balances(to); const pl = plStatement(to);
    const groups = {}; let openDiff = 0;
    for (const [k, a] of bal) {
      const L = ledgerOf(k); if (!isBS(L.group)) continue;
      (groups[L.group] = groups[L.group] || []).push({ key: k, name: L.name, amt: a });
    }
    for (const k of allLedgerKeys()) openDiff += openingOf(k);
    openDiff = r2(openDiff + stock(to).opening);
    const liab = [], assets = [];
    for (const gk of Object.keys(GROUPS)) {
      if (!isBS(gk)) continue; const rows = (groups[gk] || []).filter(r => r.amt);
      const tot = r2(rows.reduce((s, r) => s + r.amt, 0));
      if (GROUPS[gk].side === 'L') liab.push({ g: gk, rows: rows.map(r => ({ ...r, show: -r.amt })), total: -tot });
      else assets.push({ g: gk, rows: rows.map(r => ({ ...r, show: r.amt })), total: tot });
    }
    const stockRow = { g: 'stock', name: 'Closing stock', total: stock(to).total };
    let L = r2(liab.reduce((s, x) => s + x.total, 0) + pl.net);
    let A = r2(assets.reduce((s, x) => s + x.total, 0) + stockRow.total);
    return { liab, assets, stockRow, net: pl.net, openDiff, L, A };
  });
}

/* outstanding: FIFO bill-wise for one party (positive = they owe us) */
function billsOf(pkey, upto = MAXD) {
  const mv = [];
  const ob = openingOf(pkey);
  if (ob) mv.push({ date: fyStart(S.fy), ref: 'Opening balance', amt: ob, v: null });
  for (const v of active()) {
    if (v.date > upto) continue;
    let a = 0; for (const [k, x] of postings(v)) if (k === pkey) a += x;
    a = r2(a); if (a) mv.push({ date: v.date, ref: v.no || '', amt: a, v });
  }
  mv.sort((x, y) => x.date.localeCompare(y.date));
  const pos = mv.filter(m => m.amt > 0).map(m => ({ ...m, left: m.amt }));
  const neg = mv.filter(m => m.amt < 0).map(m => ({ ...m, left: -m.amt }));
  let i = 0, j = 0;
  while (i < pos.length && j < neg.length) {
    const t = Math.min(pos[i].left, neg[j].left); pos[i].left = r2(pos[i].left - t); neg[j].left = r2(neg[j].left - t);
    if (pos[i].left <= 0) i++; if (neg[j].left <= 0) j++;
  }
  const open = [...pos.filter(p => p.left > 0).map(p => ({ ...p, sign: 1 })), ...neg.filter(n => n.left > 0).map(n => ({ ...n, sign: -1 }))];
  return open;
}

    out.push({ id: it.id, label: `${it.code ? it.code + '  ' : ''}${it.name}`, sub: it.nameHi || '', right: `${qtyf(e ? e.q : 0)} ${it.unit || ''}`, exact: q && String(it.code || '').toLowerCase() === q });
  }
  out.sort((a, b) => (b.exact - a.exact) || a.label.localeCompare(b.label));
  const res = out.slice(0, 40);
  if (extra && canW()) res.push({ add: true, label: '+ Add a new item' + (q ? ` "${q}"` : ''), q });
  return res;
}
function ledgerSource(q, filter, addParty) {
  const bal = balances(); const out = [];
  for (const k of allLedgerKeys()) {
    const L = ledgerOf(k); if (filter && !filter(L)) continue;
    if (L.ref && L.ref.inactive) continue;
    if (!match(q, L.name, L.ref && L.ref.phone, L.ref && L.ref.gstin)) continue;
    out.push({ id: k, label: L.name, sub: L.kind === 'party' ? (L.group === 'creditors' ? 'Supplier' : 'Customer') : GROUPS[L.group].name, right: drcr(bal.get(k) || 0) });
  }
  out.sort((a, b) => a.label.localeCompare(b.label));
  const res = out.slice(0, 40);
  if (addParty && canW()) res.push({ add: true, label: '+ Add a new party' + (q ? ` "${q}"` : ''), q });
  return res;
}

/* ---------- exports ---------- */
const csvCell = v => { const s = String(v ?? ''); return /[",\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
function saveFile(filename, data, mime) {
  const url = URL.createObjectURL(new Blob([data], { type: mime || 'text/plain' }));
  const a = document.createElement('a'); a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
}
function exportCSV(name, head, rows) {
  const csv = '\ufeff' + [head, ...rows].map(r => r.map(csvCell).join(',')).join('\r\n');
  saveFile(`${name}.csv`, csv, 'text/csv');
}

/* ---------- parties ---------- */
VIEWS.parties = {
  render() {
    const f = F('parties', { tab: 'all', q: '' });
    const bal = balances();
    let ps = [...S.parties.values()].filter(p => f.tab === 'all' || (f.tab === 'c' ? p.group === 'debtors' : p.group === 'creditors'));
    if (f.q) { const q = f.q.toLowerCase(); ps = ps.filter(p => match(q, p.name, p.gstin, p.phone, p.city, p.address)); }
    ps.sort((a, b) => a.name.localeCompare(b.name));
    let dr = 0, cr = 0; for (const p of ps) { const b = bal.get('P:' + p.id) || 0; if (b > 0) dr += b; else cr -= b; }
    return `${ph('Parties', 'पार्टी', `<button class="btn" data-act="exportParties">Export CSV</button>${W(`<button class="btn" data-act="importDlg" data-k="parties">Import CSV</button><button class="btn primary" data-act="editParty">New party</button>`)}`)}
      ${tabs(f.tab, [['all', 'All'], ['c', 'Customers'], ['s', 'Suppliers']])}
      <div class="bar">${qIn('pt-q', f.q, 'Name, GSTIN, phone or city')}</div>
      ${ps.length ? `<div class="tw"><table class="lg"><thead><tr><th>Name</th><th class="hide-m">Type</th><th class="hide-m">GSTIN</th><th class="hide-m">Phone</th><th class="hide-m">State</th><th class="num">Balance</th></tr></thead><tbody>
        ${ps.slice(0, 600).map(p => { const b = bal.get('P:' + p.id) || 0; return `<tr class="click" data-act="openParty" data-id="${esc(p.id)}"><td>${esc(p.name)}${p.city ? ` <span class="muted">${esc(p.city)}</span>` : ''}</td><td class="hide-m">${p.group === 'creditors' ? 'Supplier' : 'Customer'}</td><td class="hide-m w">${esc(p.gstin || '')}</td><td class="hide-m w">${esc(p.phone || '')}</td><td class="hide-m">${esc(stateName(p.state))}</td><td class="num ${b < 0 ? 'neg' : ''}">${drcr(b)}</td></tr>`; }).join('')}
        </tbody><tfoot><tr><td>${ps.length} parties</td><td colspan="4" class="hide-m">Receivable ₹${money(dr)}, payable ₹${money(cr)}</td><td class="num">${drcr(dr - cr)}</td></tr></tfoot></table></div>`
      : `<div class="tw"><div class="empty"><p>${S.parties.size ? 'No parties match.' : 'Add the customers you bill on credit and the suppliers you buy from.'}</p>${W('<button class="btn primary" data-act="editParty">New party</button>')}</div></div>`}`;
  }
};

/* ---------- ledgers ---------- */
VIEWS.ledgers = {
  render() {
    const f = F('ledgers', { q: '' });
    const bal = balances(); const by = {};
    for (const k of allLedgerKeys()) { const L = ledgerOf(k); if (L.kind === 'party') continue; if (f.q && !match(f.q.toLowerCase(), L.name)) continue; (by[L.group] = by[L.group] || []).push(L); }
    const debt = [...S.parties.values()].filter(p => p.group === 'debtors'), cred = [...S.parties.values()].filter(p => p.group === 'creditors');
    const sumP = list => r2(list.reduce((s, p) => s + (bal.get('P:' + p.id) || 0), 0));
    const body = Object.keys(GROUPS).map(g => {
      const list = (by[g] || []).sort((a, b) => a.name.localeCompare(b.name));
      const partyRow = g === 'debtors' ? `<tr class="click sub" data-act="go" data-v="parties"><td>${debt.length} customers</td><td class="hide-m">Parties</td><td class="num hide-m"></td><td class="num">${drcr(sumP(debt))}</td></tr>`
        : g === 'creditors' ? `<tr class="click sub" data-act="go" data-v="parties"><td>${cred.length} suppliers</td><td class="hide-m">Parties</td><td class="num hide-m"></td><td class="num">${drcr(sumP(cred))}</td></tr>` : '';
      if (!list.length && !partyRow) return '';
      return `<tr class="grp"><td colspan="4">${esc(GROUPS[g].name)}</td></tr>${list.map(L => `<tr class="click" data-act="goLedger" data-k="${L.key}"><td>${esc(L.name)}</td><td class="hide-m">${L.kind === 'sys' ? '<span class="chip">Built in</span>' : ''}</td><td class="num hide-m">${isBS(L.group) ? drcr(openingOf(L.key)) : ''}</td><td class="num">${drcr(bal.get(L.key) || 0)}</td></tr>`).join('')}${partyRow}`;
    }).join('');
    return `${ph('Ledgers', 'खाते', W(`${S.canAdmin ? '<button class="btn" data-act="sysOpen">Opening balances</button>' : ''}<button class="btn primary" data-act="editLedger">New ledger</button>`))}
      <p class="lead">Every entry posts to these accounts automatically. Add your bank accounts, expense heads and income heads here; customers and suppliers live under Parties.</p>
      <div class="bar">${qIn('lg-q', f.q, 'Ledger name')}</div>
      <div class="tw"><table class="lg"><thead><tr><th>Ledger</th><th class="hide-m"></th><th class="num hide-m">Opening</th><th class="num">Balance now</th></tr></thead><tbody>${body}</tbody></table></div>
      <p class="cap">Click a ledger to see its statement. Custom ledgers can be edited from the statement page.</p>`;
  }
};

/* ---------- day book ---------- */
VIEWS.daybook = {
  render() {
    const f = F('daybook', { from: defTo(), to: defTo(), type: '', q: '' });
    let rows = S.vouchers.filter(v => v.date >= f.from && v.date <= f.to && (!f.type || v.type === f.type));
    if (f.q) { const q = f.q.toLowerCase(); rows = rows.filter(v => match(q, v.no, partyName(v), v.narration)); }
    rows.sort((a, b) => a.date.localeCompare(b.date) || (a.ca || 0) - (b.ca || 0));
    let dr = 0; for (const v of rows) if (v.status !== 'cancelled') dr += vAmount(v);
    const shown = rows.slice(-600);
    return `${ph('Day book', 'रोज़नामचा', '<button class="btn" data-act="exportDaybook">Export CSV</button>')}
      <div class="bar">${dateIn('db-from', 'from', f.from, 'From')}${dateIn('db-to', 'to', f.to, 'To')}${presets()}
        <label class="f">Type<select class="in" data-f="type"><option value="">All entries</option>${Object.entries(TYPES).map(([k, t]) => `<option value="${k}"${k === f.type ? ' selected' : ''}>${esc(t.label)}</option>`).join('')}</select></label>
        ${qIn('db-q', f.q, 'Number, party or narration')}</div>
      ${rows.length ? `<div class="tw"><table class="lg"><thead><tr><th>Date</th><th>Type</th><th>Number</th><th>Particulars</th><th class="num">Amount</th><th class="hide-m">By</th><th class="hide-m">Saved</th><th></th></tr></thead><tbody>
        ${shown.map(v => `<tr class="${rowCls(v)}" data-act="openV" data-id="${esc(v.id)}"><td class="w">${dmy(v.date)}</td><td>${esc(TYPES[v.type].short)}</td><td class="w">${esc(v.no)}</td>
          <td>${esc(TYPES[v.type].trade ? partyName(v) : v.type === 'stock' ? (v.narration || 'Stock adjustment') : (v.entries || []).map(e => lname(e.l)).join(', '))}</td>
          <td class="num">${v.type === 'stock' ? '' : money(vAmount(v))}</td><td class="hide-m">${byCell(v)}</td><td class="hide-m muted w">${esc(tm(v.ua))}</td><td class="keep">${statusChip(v)}</td></tr>`).join('')}
        </tbody><tfoot><tr><td colspan="4">${rows.length} entries</td><td class="num">${money(dr)}</td><td colspan="3" class="hide-m"></td></tr></tfoot></table></div>${cap(shown.length, rows.length)}`
      : `<div class="tw"><div class="empty"><p>No entries in these dates.</p></div></div>`}`;
  }
};
ACT.exportDaybook = () => {
  const f = S.f.daybook;
  const rows = S.vouchers.filter(v => v.date >= f.from && v.date <= f.to && (!f.type || v.type === f.type)).flatMap(v => {
    const ps = postings(Object.assign({}, v, { status: 'active' }));
    return ps.map(([k, a]) => [dmy(v.date), TYPES[v.type].label, v.no, partyName(v), lname(k), a > 0 ? a : '', a < 0 ? -a : '', v.narration || '', v.status || 'active']);
  });
  exportCSV(`daybook-${f.from}-to-${f.to}`, ['Date', 'Type', 'Number', 'Party', 'Ledger', 'Debit', 'Credit', 'Narration', 'Status'], rows);
};

/* ---------- ledger statement ---------- */
VIEWS.ledger = {
  render() {
    const f = F('ledger', { key: 'S:CASH', from: fyStart(S.fy), to: defTo() });
    const L = ledgerOf(f.key);
    const opening = balances(addDays(f.from, -1)).get(f.key) || 0;
    const lines = [];
    for (const v of active()) {
      if (v.date < f.from || v.date > f.to) continue;
      const ps = postings(v); let a = 0; for (const [k, x] of ps) if (k === f.key) a += x; a = r2(a); if (!a) continue;
      const others = [...new Set(ps.filter(([k, x]) => k !== f.key && Math.sign(x) !== Math.sign(a)).map(([k]) => lname(k)))];
      lines.push({ v, a, part: others.length > 2 ? others.slice(0, 2).join(', ') + ' and others' : others.join(', ') });
    }
    let run = opening, dr = 0, cr = 0;
    const editBtn = L.kind === 'ledger' ? W(`<button class="btn" data-act="editLedger" data-id="${esc(f.key.slice(2))}">Edit ledger</button>`) : L.kind === 'party' ? `<button class="btn" data-act="openParty" data-id="${esc(f.key.slice(2))}">Party details</button>` : '';
    return `${ph('Ledger statement', 'खाता विवरण', `${editBtn}<button class="btn" data-act="exportLedger">Export CSV</button>`)}
      <div class="bar"><label class="f" style="min-width:280px;flex:1;max-width:420px">Ledger<div class="combo"><input class="in" id="lr-key" value="${esc(L.name)}"></div></label>
        ${dateIn('lr-from', 'from', f.from, 'From')}${dateIn('lr-to', 'to', f.to, 'To')}${presets()}</div>
      <div class="tw"><table class="lg"><thead><tr><th>Date</th><th>Particulars</th><th class="hide-m">Type</th><th>Number</th><th class="num">Debit</th><th class="num">Credit</th><th class="num">Balance</th></tr></thead><tbody>
        <tr class="sub"><td class="w">${dmy(f.from)}</td><td colspan="5">Opening balance</td><td class="num">${drcr(opening)}</td></tr>
        ${lines.map(x => { run = r2(run + x.a); if (x.a > 0) dr += x.a; else cr -= x.a;
          return `<tr class="click" data-act="openV" data-id="${esc(x.v.id)}"><td class="w">${dmy(x.v.date)}</td><td>${esc(x.part || '—')}${x.v.narration ? `<br><span class="muted">${esc(x.v.narration)}</span>` : ''}</td><td class="hide-m">${esc(TYPES[x.v.type].short)}</td><td class="w">${esc(x.v.no)}</td><td class="num">${x.a > 0 ? money(x.a) : ''}</td><td class="num">${x.a < 0 ? money(-x.a) : ''}</td><td class="num">${drcr(run)}</td></tr>`; }).join('')}
      </tbody><tfoot><tr><td colspan="4">Closing balance</td><td class="num">${money(dr)}</td><td class="num">${money(cr)}</td><td class="num">${drcr(run)}</td></tr></tfoot></table></div>
      ${lines.length ? '' : '<p class="cap">No entries for this ledger in these dates.</p>'}`;
  },
  after(root) {
    const inp = $('#lr-key', root); if (!inp) return;
    inp.addEventListener('focus', () => inp.select());
    attachCombo(inp, q => ledgerSource(q), o => { S.f.ledger.key = o.id; renderView(); });
  }
};
ACT.exportLedger = () => {
  const f = S.f.ledger; const rows = [];
  for (const v of active()) { if (v.date < f.from || v.date > f.to) continue; let a = 0; for (const [k, x] of postings(v)) if (k === f.key) a += x; a = r2(a); if (a) rows.push([dmy(v.date), TYPES[v.type].label, v.no, partyName(v), a > 0 ? a : '', a < 0 ? -a : '', v.narration || '']); }
  exportCSV(`ledger-${lname(f.key).replace(/[^\w]+/g, '-')}-${f.from}-to-${f.to}`, ['Date', 'Type', 'Number', 'Party', 'Debit', 'Credit', 'Narration'], rows);
};

/* ---------- outstanding ---------- */
VIEWS.outstanding = {
  render() {
    const f = F('outstanding', { tab: 'recv', q: '' });
    const t = defTo(); const bal = balances(); const rows = [];
    for (const p of S.parties.values()) {
      const b = bal.get('P:' + p.id) || 0;
      if (f.tab === 'recv' ? b <= 0 : b >= 0) continue;
      if (f.q && !match(f.q.toLowerCase(), p.name, p.phone, p.city)) continue;
      const bills = billsOf('P:' + p.id); const bk = [0, 0, 0, 0]; let oldest = null;
      for (const x of bills) {
        if ((f.tab === 'recv') !== (x.sign > 0)) continue;
        const age = dayDiff(x.date, t); bk[age <= 30 ? 0 : age <= 60 ? 1 : age <= 90 ? 2 : 3] += x.left; if (!oldest || x.date < oldest) oldest = x.date;
      }
      rows.push({ p, b: Math.abs(b), bk, oldest });
    }
    rows.sort((a, b) => b.b - a.b);
    const tot = [0, 0, 0, 0, 0]; for (const r of rows) { r.bk.forEach((x, i) => tot[i] += x); tot[4] += r.b; }
    return `${ph('Outstanding', 'बकाया', '')}
      ${tabs(f.tab, [['recv', 'To receive'], ['pay', 'To pay']])}
      <div class="bar">${qIn('os-q', f.q, 'Party name, phone or city')}</div>
      <p class="lead">Payments are matched against the oldest bills first. Age is counted in days up to ${esc(dmy(t))}.</p>
      ${rows.length ? `<div class="tw"><table class="lg"><thead><tr><th>Party</th><th class="hide-m">Phone</th><th class="hide-m">Oldest bill</th><th class="num">0\u201330 days</th><th class="num">31\u201360</th><th class="num">61\u201390</th><th class="num">Over 90</th><th class="num">Total</th></tr></thead><tbody>
        ${rows.map(r => `<tr class="click" data-act="openParty" data-id="${esc(r.p.id)}"><td>${esc(r.p.name)}</td><td class="hide-m w">${esc(r.p.phone || '')}</td><td class="hide-m w">${r.oldest ? dmy(r.oldest) : ''}</td>${r.bk.map((x, i) => `<td class="num ${i === 3 && x > 0 ? 'neg' : ''}">${x ? money(x) : ''}</td>`).join('')}<td class="num">${money(r.b)}</td></tr>`).join('')}
        </tbody><tfoot><tr><td colspan="3" class="hide-m">${rows.length} parties</td>${tot.map(x => `<td class="num">${money(x)}</td>`).join('')}</tr></tfoot></table></div>`
      : `<div class="tw"><div class="empty"><p>Nothing is outstanding.</p></div></div>`}`;
  }
};

/* ---------- trial balance ---------- */
VIEWS.trial = {
  render() {
    const f = F('trial', { to: defTo() });
    const bal = balances(f.to); const st = stock(f.to);
    let dr = 0, cr = 0; const by = {};
    for (const [k, a] of bal) { if (!a) continue; const L = ledgerOf(k); (by[L.group] = by[L.group] || []).push({ L, a }); if (a > 0) dr += a; else cr -= a; }
    if (st.opening) dr += st.opening;
    const diff = r2(dr - cr);
    const body = Object.keys(GROUPS).map(g => {
      const list = (by[g] || []).sort((a, b) => a.L.name.localeCompare(b.L.name)); if (!list.length) return '';
      const gd = list.reduce((s, x) => s + x.a, 0);
      return `<tr class="grp"><td>${esc(GROUPS[g].name)}</td><td class="num">${gd > 0 ? money(gd) : ''}</td><td class="num">${gd < 0 ? money(-gd) : ''}</td></tr>` +
        list.map(x => `<tr class="click sub" data-act="goLedger" data-k="${x.L.key}"><td style="padding-left:24px">${esc(x.L.name)}</td><td class="num">${x.a > 0 ? money(x.a) : ''}</td><td class="num">${x.a < 0 ? money(-x.a) : ''}</td></tr>`).join('');
    }).join('');
    return `${ph('Trial balance', 'तलपट', '')}
      <div class="bar">${dateIn('tb-to', 'to', f.to, 'As on')}</div>
      <div class="tw" style="max-width:860px"><table class="lg"><thead><tr><th>Particulars</th><th class="num">Debit</th><th class="num">Credit</th></tr></thead><tbody>
      ${st.opening ? `<tr class="grp"><td>Opening stock</td><td class="num">${money(st.opening)}</td><td></td></tr>` : ''}
      ${body}
      ${diff ? `<tr class="grp"><td>Difference in opening balances</td><td class="num">${diff < 0 ? money(-diff) : ''}</td><td class="num">${diff > 0 ? money(diff) : ''}</td></tr>` : ''}
      </tbody><tfoot><tr><td>Total</td><td class="num">${money(Math.max(dr, cr))}</td><td class="num">${money(Math.max(dr, cr))}</td></tr></tfoot></table></div>
      ${diff ? `<p class="cap">Opening balances don\u2019t add up by ₹${money(Math.abs(diff))}. Check opening balances of ledgers, parties and opening stock.</p>` : ''}`;
  }
};

/* ---------- profit & loss ---------- */
const tRows = rows => rows.map(r => r.grp ? `<tr class="grp"><td>${esc(r.name)}</td><td class="num">${r.amt === '' ? '' : money(r.amt)}</td></tr>`
  : `<tr class="${r.key ? 'click ' : ''}sub" ${r.key ? `data-act="goLedger" data-k="${r.key}"` : ''}><td style="padding-left:24px">${esc(r.name)}</td><td class="num">${money(r.amt)}</td></tr>`).join('');
const tSide = (title, rows, total) => `<div><div class="tw"><table class="lg"><thead><tr><th>${esc(title)}</th><th class="num">₹</th></tr></thead><tbody>${tRows(rows)}</tbody><tfoot><tr><td>Total</td><td class="num">${money(total)}</td></tr></tfoot></table></div></div>`;
const list = (arr, sign) => arr.filter(x => x.amt).sort((a, b) => a.name.localeCompare(b.name)).map(x => ({ key: x.key, name: x.name, amt: sign * x.amt }));
VIEWS.pnl = {
  render() {
    const f = F('pnl', { to: defTo() });
    const p = plStatement(f.to);
    const L1 = [{ grp: 1, name: 'Opening stock', amt: p.opening }, { grp: 1, name: 'Purchases (net of returns)', amt: p.purNet }, ...list(p.g.purchase, 1),
      ...(p.dirExp ? [{ grp: 1, name: 'Direct expenses', amt: p.dirExp }, ...list(p.g.dir_exp, 1)] : [])];
    const R1 = [{ grp: 1, name: 'Sales (net of returns)', amt: p.salesNet }, ...list(p.g.sales, -1),
      ...(p.dirInc ? [{ grp: 1, name: 'Direct income', amt: p.dirInc }, ...list(p.g.dir_inc, -1)] : []), { grp: 1, name: 'Closing stock', amt: p.closing }];
    if (p.gross >= 0) L1.push({ grp: 1, name: 'Gross profit', amt: p.gross }); else R1.push({ grp: 1, name: 'Gross loss', amt: -p.gross });
    const t1 = r2(Math.max(p.opening + p.purNet + p.dirExp + Math.max(p.gross, 0), p.salesNet + p.dirInc + p.closing + Math.max(-p.gross, 0)));
    const L2 = [...(p.gross < 0 ? [{ grp: 1, name: 'Gross loss', amt: -p.gross }] : []), ...(p.g.ind_exp.length ? [{ grp: 1, name: 'Indirect expenses', amt: p.indExp }, ...list(p.g.ind_exp, 1)] : [])];
    const R2 = [...(p.gross >= 0 ? [{ grp: 1, name: 'Gross profit', amt: p.gross }] : []), ...(p.g.ind_inc.length ? [{ grp: 1, name: 'Indirect income', amt: p.indInc }, ...list(p.g.ind_inc, -1)] : [])];
    if (p.net >= 0) L2.push({ grp: 1, name: 'Net profit', amt: p.net }); else R2.push({ grp: 1, name: 'Net loss', amt: -p.net });
    const t2 = r2(Math.max(Math.max(-p.gross, 0) + p.indExp + Math.max(p.net, 0), Math.max(p.gross, 0) + p.indInc + Math.max(-p.net, 0)));
    return `${ph('Profit & loss', 'लाभ-हानि', '')}
      <div class="bar">${dateIn('pl-to', 'to', f.to, 'Period ending')}<span class="cap">From ${dmy(fyStart(S.fy))}. Stock is valued at weighted average cost.</span></div>
      <h3 style="margin:6px 0 8px;font-weight:600">Trading account</h3>
      <div class="tform">${tSide('Debit', L1, t1)}${tSide('Credit', R1, t1)}</div>
      <h3 style="margin:20px 0 8px;font-weight:600">Profit & loss account</h3>
      <div class="tform">${tSide('Debit', L2, t2)}${tSide('Credit', R2, t2)}</div>
      <p class="cap ${p.net < 0 ? 'neg' : ''}" style="font-size:15px;margin-top:12px">${p.net >= 0 ? 'Net profit' : 'Net loss'} for the period: ₹${money(Math.abs(p.net))}</p>`;
  }
};

/* ---------- balance sheet ---------- */
VIEWS.bs = {
  render() {
    const f = F('bs', { to: defTo() });
    const b = balanceSheet(f.to);
    const Lr = [], Ar = [];
    for (const g of b.liab) {
      if (g.g === 'capital') { Lr.push({ grp: 1, name: GROUPS.capital.name, amt: r2(g.total + b.net) }); Lr.push(...g.rows.map(r => ({ key: r.key, name: r.name, amt: r.show }))); Lr.push({ name: b.net >= 0 ? 'Add: profit for the period' : 'Less: loss for the period', amt: b.net }); continue; }
      if (!g.rows.length) continue; Lr.push({ grp: 1, name: GROUPS[g.g].name, amt: g.total }, ...g.rows.map(r => ({ key: r.key, name: r.name, amt: r.show })));
    }
    if (!b.liab.find(g => g.g === 'capital')) Lr.push({ grp: 1, name: 'Profit & loss', amt: b.net });
    Ar.push({ grp: 1, name: 'Closing stock', amt: b.stockRow.total });
    for (const g of b.assets) { if (!g.rows.length) continue; Ar.push({ grp: 1, name: GROUPS[g.g].name, amt: g.total }, ...g.rows.map(r => ({ key: r.key, name: r.name, amt: r.show }))); }
    let L = b.L, A = b.A; const d = r2(A - L);
    if (d > 0) { Lr.push({ grp: 1, name: 'Difference in opening balances', amt: d }); L = A; }
    if (d < 0) { Ar.push({ grp: 1, name: 'Difference in opening balances', amt: -d }); A = L; }
    return `${ph('Balance sheet', 'तुलन पत्र', '')}
      <div class="bar">${dateIn('bs-to', 'to', f.to, 'As on')}</div>
      <div class="tform">${tSide('Liabilities', Lr, L)}${tSide('Assets', Ar, A)}</div>
      ${d ? `<p class="cap">The opening balances you entered don\u2019t balance by ₹${money(Math.abs(d))}. Check opening balances under Ledgers, Parties and Inventory.</p>` : ''}`;
  }
};

/* ---------- GST summary ---------- */
function gstData(from, to) {
  const out = {}, inp = {}, hsn = {}; let b2b = { tx: 0, tax: 0, n: 0 }, b2c = { tx: 0, tax: 0, n: 0 };
  const add = (m, k, l, s) => { const r = m[k] || (m[k] = { tx: 0, c: 0, s: 0, i: 0 }); r.tx += s * num(l.taxable); r.c += s * num(l.cgst); r.s += s * num(l.sgst); r.i += s * num(l.igst); };
  for (const v of active()) {
    if (!TYPES[v.type].trade || v.date < from || v.date > to) continue;
    const s = (v.type === 'sale' || v.type === 'purchase') ? 1 : -1;
    const outward = v.type === 'sale' || v.type === 'sret';
    const gstin = v.party ? ((S.parties.get(v.party.slice(2)) || {}).gstin || '') : '';
    for (const l of v.lines || []) {
      add(outward ? out : inp, num(l.gst), l, s);
      if (outward) {
        const k = `${l.hsn || '—'}|${num(l.gst)}`; const h = hsn[k] || (hsn[k] = { hsn: l.hsn || '—', gst: num(l.gst), unit: l.unit, q: 0, tx: 0, tax: 0 });
        h.q += s * num(l.qty); h.tx += s * num(l.taxable); h.tax += s * num(l.tax);
        const bk = gstin ? b2b : b2c; bk.tx += s * num(l.taxable); bk.tax += s * num(l.tax);
      }
    }
    if (outward && v.type === 'sale') (gstin ? b2b : b2c).n++;
  }
  return { out, inp, hsn, b2b, b2c };
}

ACT.acSave = el => acSave(el.dataset.then);
async function acSave(then) {
  const sh = S.sheet; if (!sh || sh.kind !== 'acct' || sh.saving) return;
  const d = sh.d; const err = m => { $('#ac-err').textContent = m; return false; };
  if (dateErr(d.date)) return err(dateErr(d.date));
  let entries;
  if (d.type === 'journal') {
    const ls = d.lines.filter(x => x.l || num(x.dr) || num(x.cr));
    for (let i = 0; i < ls.length; i++) { if (!ls[i].l) return err(`Line ${i + 1}: pick a ledger from the list.`); if (num(ls[i].dr) && num(ls[i].cr)) return err(`Line ${i + 1}: enter either a debit or a credit, not both.`); if (num(ls[i].dr) < 0 || num(ls[i].cr) < 0) return err(`Line ${i + 1}: amounts can\u2019t be negative.`); }
    const dr = r2(ls.reduce((a, x) => a + num(x.dr), 0)), cr = r2(ls.reduce((a, x) => a + num(x.cr), 0));
    if (ls.length < 2 || !dr) return err('A journal needs at least one debit and one credit line.');
    if (dr !== cr) return err(`Debits and credits differ by ₹${money(Math.abs(dr - cr))}.`);
    entries = ls.map(x => ({ l: x.l, dr: r2(num(x.dr)), cr: r2(num(x.cr)) }));
  } else {
    const a = r2(num(d.amt));
    if (!d.other) return err(d.type === 'contra' ? 'Choose where the money goes.' : 'Pick a ledger or party from the list.');
    if (!(a > 0)) return err('Enter an amount above zero.');
    if (d.other === d.acct) return err('Both sides can\u2019t be the same account.');
    entries = d.type === 'receipt' ? [{ l: d.acct, dr: a, cr: 0 }, { l: d.other, dr: 0, cr: a }] : [{ l: d.other, dr: a, cr: 0 }, { l: d.acct, dr: 0, cr: a }];
  }
  sh.saving = true; $$('#sheet .sh-f .btn').forEach(b => b.disabled = true); err('Saving\u2026');
  try {
    const now = Date.now();
    const v = { type: d.type, date: d.date, entries, narration: String(d.narration || '').trim(), party: null, _x: null };
    v.id = sh.orig ? sh.orig.id : newId(); void now;
    const saved = await writeVoucher(v, sh.orig ? sh.orig.rev : null);
    toast(`${TYPES[saved.type].short} ${saved.no} saved for ₹${money(vAmount(saved))}`);
    closeSheetNow();
    if (then === 'print') printVoucher(saved);
    if (then === 'new') newVoucher(v.type);
  } catch (e) { sh.saving = false; $$('#sheet .sh-f .btn').forEach(b => b.disabled = false); err(dbErrMsg(e)); }
}

function parseTable(text) {
  text = text.replace(/^\ufeff/, '');
  const first = text.split(/\r?\n/)[0] || '';
  const sep = first.includes('\t') && !first.includes(',') ? '\t' : first.split(';').length > first.split(',').length ? ';' : ',';
  const rows = []; let row = [], f = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) { if (c === '"') { if (text[i + 1] === '"') { f += '"'; i++; } else q = false; } else f += c; }
    else if (c === '"' && f === '') q = true;
    else if (c === sep) { row.push(f); f = ''; }
    else if (c === '\n' || c === '\r') { if (c === '\r' && text[i + 1] === '\n') i++; row.push(f); rows.push(row); row = []; f = ''; }
    else f += c;
  }
  if (f !== '' || row.length) { row.push(f); rows.push(row); }
  return rows.map(r => r.map(x => x.trim())).filter(r => r.some(x => x !== ''));
}

ACT.importDlg = el => {

  const kind = el.dataset.k; const cfg = IMPORT[kind]; let parsed = [];
  const html = `${dlgHead(cfg.title, 'Paste rows copied from Excel or Tally, or choose a CSV file. The first row must be the column headings.')}
  <div class="sh-b">
    <p class="cap" style="margin-top:0">Columns it understands: ${esc(cfg.help)}. Other columns are ignored.</p>
    <div class="bar"><input type="file" id="im-file" accept=".csv,.txt,text/csv,text/plain"><label class="ck"><input type="checkbox" id="im-upd" checked> Update ${kind === 'items' ? 'items whose code' : 'parties whose name'} already exists</label></div>
    <textarea class="in" id="im-text" rows="8" placeholder="code,name,hsn,gst,mrp,opening qty"></textarea>
    <div id="im-prev" style="margin-top:12px"></div>
  </div>
  ${dlgFoot('<span id="im-prog" class="muted"></span><span class="sp"></span><button class="btn" data-act="closeDialog">Close</button><button class="btn primary" id="im-go" disabled>Import</button>')}`;
  const preview = () => {
    const rows = parseTable($('#im-text').value); parsed = [];
    if (rows.length < 2) { $('#im-prev').innerHTML = rows.length ? '<p class="muted">Add at least one row under the headings.</p>' : ''; $('#im-go').disabled = true; return; }
    const head = rows[0].map(h => h.toLowerCase().replace(/\s+/g, ' ').trim());
    const map = {}; for (const [k, names] of Object.entries(cfg.cols)) { const i = head.findIndex(h => names.includes(h)); if (i >= 0) map[k] = i; }
    if (map[cfg.need] === undefined) { $('#im-prev').innerHTML = `<div class="banner red">No \u201c${cfg.need}\u201d column found. Headings seen: ${esc(rows[0].join(', '))}</div>`; $('#im-go').disabled = true; return; }
    let skip = 0, upd = 0;
    for (const r of rows.slice(1)) {
      const o = {}; for (const k in map) o[k] = r[map[k]] || '';
      if (!o[cfg.need]) { skip++; continue; }
      const x = cfg.build(o); const ex = cfg.find(x); if (ex) upd++;
      parsed.push({ x, ex });
    }
    $('#im-prev').innerHTML = `<p style="margin:0 0 8px">${parsed.length} rows ready: ${parsed.length - upd} new, ${upd} already exist${skip ? `, ${skip} skipped without a ${cfg.need}` : ''}. Columns matched: ${esc(Object.keys(map).join(', '))}.</p>
      <div class="tw"><table class="lg"><thead><tr>${Object.keys(map).map(k => `<th>${esc(k)}</th>`).join('')}</tr></thead><tbody>${rows.slice(1, 6).map(r => `<tr>${Object.values(map).map(i => `<td>${esc(r[i] || '')}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
    $('#im-go').disabled = !parsed.length;
  };
  const run = async () => {
    const updOk = $('#im-upd').checked; const jobs = parsed.filter(p => !p.ex || updOk);
    const prog = $('#im-prog'); $('#im-go').disabled = true;
    try {
      const n = await saveMasters(kind, jobs.map(({ x, ex }) => ({ id: ex ? ex.id : newId(), data: x })), (done, all) => { if (prog) prog.textContent = `Imported ${done} of ${all}`; });
      toast(`Imported ${n} ${kind}`); closeDialog();
    } catch (e) { if (prog) prog.textContent = ''; dErr(dbErrMsg(e)); $('#im-go').disabled = false; }
  };
  openDialog(html, {
    wide: true, sticky: true, bind: d => {
      $('#im-text', d).addEventListener('input', preview);
      $('#im-file', d).addEventListener('change', e => { const f = e.target.files[0]; if (!f) return; const rd = new FileReader(); rd.onload = () => { $('#im-text').value = rd.result; preview(); }; rd.readAsText(f); });
      $('#im-go', d).onclick = run;
    }
  });
};

ACT.saveCompany = async el => {
  if (!S.canAdmin) return;
  const g = id => $('#' + id).value.trim();
  const gstin = g('co-gstin').toUpperCase();
  if (!g('co-name')) { toast('Enter the company name.', 'err'); return; }
  if (gstin && !GSTIN_RE.test(gstin)) { toast('That GSTIN doesn\u2019t look right. It has 15 characters, like 09AAAAA0000A1Z5.', 'err'); return; }
  const prefix = g('co-prefix') || 'INV/{FY}/';
  if (prefix.replace('{FY}', '26-27').length > 12 || /[^A-Za-z0-9/\-{}]/.test(prefix)) { toast('Keep the prefix to 12 characters using letters, numbers, / and -. GST invoice numbers can be at most 16 characters.', 'err'); return; }
  const data = { name: g('co-name'), nameHi: g('co-nameHi'), address: g('co-address'), gstin, state: $('#co-state').value || (gstin ? gstin.slice(0, 2) : ''), phone: g('co-phone'), email: g('co-email'),
    bank: g('co-bank'), terms: g('co-terms'), prefix, negStock: $('#co-neg').value, incl: $('#co-incl').checked, round: $('#co-round').checked };
  el.disabled = true;
  try { await saveSetting('company', data); toast('Company details saved'); } catch (e) { toast(dbErrMsg(e), 'err'); }
  el.disabled = false;
};
ACT.carryForward = async el => {
  if (!S.canAdmin) return;
  const nx = fyShift(S.fy, 1), end = fyEnd(S.fy);
  if (!(await confirmBox(`Carry balances forward to FY ${nx}?`, `Opening balances for FY ${nx} will be replaced with the closing balances of FY ${S.fy} as on ${dmy(end)}.`, 'Carry forward'))) return;
  const bal = balances(end), st = stock(end), pl = plStatement(end);
  const jobs = { items: [], parties: [], ledgers: [] };
  for (const it of S.items.values()) { const e = st.get(it.id); jobs.items.push({ id: it.id, data: { ob: { [nx]: { q: e ? Math.max(e.q, 0) : 0, r: e ? r2(e.avg) : 0 } } } }); }
  for (const p of S.parties.values()) jobs.parties.push({ id: p.id, data: { ob: { [nx]: bal.get('P:' + p.id) || 0 } } });
  for (const l of S.ledgers.values()) if (isBS(l.group)) jobs.ledgers.push({ id: l.id, data: { ob: { [nx]: bal.get('L:' + l.id) || 0 } } });
  const sys = {}; for (const k of SYS_BS) { let a = bal.get('S:' + k) || 0; if (k === 'CAPITAL') a = r2(a - pl.net); if (a) sys[k] = a; }
  el.disabled = true; let done = 0;
  try {
    await saveSetting('sysob', Object.assign({}, clone(S.sysob || {}), { [nx]: sys }));
    const all = jobs.items.length + jobs.parties.length + jobs.ledgers.length;
    for (const t of MASTER_TABLES) { const base = done; await saveMasters(t, jobs[t], n => { done = base + n; el.textContent = `Carrying forward\u2026 ${done} of ${all}`; }); }
    toast(`Balances carried forward to FY ${nx}`);
  } catch (e) { toast(dbErrMsg(e), 'err'); }
  el.disabled = false; el.textContent = `Carry balances forward to FY ${nx}`;
};
